<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>Ledger for Amazon</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="logo"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M230.14,58.87A8,8,0,0,0,224,56H62.68L56.6,22.57A8,8,0,0,0,48.73,16H24a8,8,0,0,0,0,16h18L67.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,160,204a28,28,0,1,0,28-28H91.17a8,8,0,0,1-7.87-6.57L80.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,230.14,58.87ZM104,204a12,12,0,1,1-12-12A12,12,0,0,1,104,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,200,204Zm4-74.57A8,8,0,0,1,196.1,136H77.22L65.59,72H214.41Z"/></svg></span>
    <h1 id="title">Ledger for Amazon</h1>
  </div>
  <span class="version" id="version"></span>
</header>

<!-- Setup -->
<section id="setup" hidden>
  <form id="setup-form" class="form" autocomplete="off">
    <label for="ledger">Ledger address</label>
    <input id="ledger" name="ledger" type="text" inputmode="url" placeholder="https://ledger.example.com" required spellcheck="false">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required spellcheck="false" autocapitalize="off">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <label for="code">Add a phone code</label>
    <input id="code" name="code" type="text" required spellcheck="false" autocapitalize="characters" placeholder="ABCD-EFGH">
    <p class="hint">Settings › Sign-in &amp; people › Add a phone</p>
    <p class="error" id="setup-error" role="alert" hidden></p>
  </form>
  <footer class="actions">
    <button type="submit" form="setup-form" class="primary" id="connect">Connect</button>
  </footer>
</section>

<!-- Connected -->
<section id="connected" hidden>
  <div class="body">
    <p class="status"><span class="dot" id="dot"></span><strong id="status-word">Connected</strong><span class="muted" id="status-when"></span></p>

    <div class="problem" id="problem" hidden>
      <span class="problem-icon"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z"/></svg></span>
      <div>
        <p class="problem-title" id="problem-title"></p>
        <p class="problem-body" id="problem-body"></p>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="num" id="split">0</span><span class="label">Charges split this month</span></div>
      <div class="stat"><span class="num" id="waiting">0</span><span class="label">Waiting on bank</span></div>
    </div>

    <div class="card">
      <div class="row">
        <label for="auto">Sync automatically</label>
        <button id="auto" class="switch" role="switch" aria-checked="true" aria-label="Sync automatically"><span></span></button>
      </div>
      <div class="row"><span>Next sync</span><span class="muted" id="next"></span></div>
      <div class="row">
        <span>Accent</span>
        <span class="swatches" id="swatches"></span>
      </div>
    </div>

    <div class="last-run">
      <p class="muted small" id="through"></p>
      <p class="muted small" id="run-orders"></p>
      <p class="muted small" id="run-result"></p>
      <button class="link small-link" id="outline-link" hidden>Copy Page Outline</button>
    </div>
  </div>
  <footer class="actions">
    <button class="primary" id="main-action"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M224,48V96a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h28.69L182.06,73.37a79.56,79.56,0,0,0-56.13-23.43h-.45A79.52,79.52,0,0,0,69.59,72.71,8,8,0,0,1,58.41,61.27a96,96,0,0,1,135,.79L208,76.69V48a8,8,0,0,1,16,0ZM186.41,183.29a80,80,0,0,1-112.47-.66L59.31,168H88a8,8,0,0,0,0-16H40a8,8,0,0,0-8,8v48a8,8,0,0,0,16,0V179.31l14.63,14.63A95.43,95.43,0,0,0,130,222.06h.53a95.36,95.36,0,0,0,67.07-27.33,8,8,0,0,0-11.18-11.44Z"/></svg><span id="main-label">Sync Now</span></button>
    <div class="links">
      <button class="link" id="open-ledger">Open Ledger</button>
      <button class="link" id="retry" hidden>Sync Now</button>
      <button class="link" id="disconnect">Disconnect</button>
    </div>
  </footer>
</section>

<script src="popup.js" type="module"></script>
</body>
</html>
